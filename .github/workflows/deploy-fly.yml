name: Deploy to Fly.io

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      PHX_HOST: ${{ secrets.PHX_HOST }}
      DNS_CLUSTER_QUERY: ${{ secrets.DNS_CLUSTER_QUERY }}
      MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
      MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}

    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate deploy secrets
        run: |
          set -eu
          [ -n "${FLY_API_TOKEN:-}" ] || { echo "::error::Missing GitHub Actions secret FLY_API_TOKEN"; exit 1; }
          [ -n "${FLY_APP_NAME:-}" ] || { echo "::error::Missing GitHub Actions secret FLY_APP_NAME"; exit 1; }
          [ -n "${SECRET_KEY_BASE:-}" ] || { echo "::error::Missing GitHub Actions secret SECRET_KEY_BASE"; exit 1; }

      - name: Ensure Fly app exists
        run: |
          set -eu
          if ! flyctl status --app "$FLY_APP_NAME" >/dev/null 2>&1; then
            flyctl apps create "$FLY_APP_NAME"
          fi

      - name: Sync Fly secrets
        run: |
          set -eu
          app_host="${PHX_HOST:-${FLY_APP_NAME}.fly.dev}"
          dns_cluster_query="${DNS_CLUSTER_QUERY:-${FLY_APP_NAME}.internal}"

          args=(
            "SECRET_KEY_BASE=$SECRET_KEY_BASE"
            "PHX_HOST=$app_host"
            "DNS_CLUSTER_QUERY=$dns_cluster_query"
          )

          if [ -n "${MAILGUN_API_KEY:-}" ]; then
            args+=("MAILGUN_API_KEY=$MAILGUN_API_KEY")
          fi

          if [ -n "${MAILGUN_DOMAIN:-}" ]; then
            args+=("MAILGUN_DOMAIN=$MAILGUN_DOMAIN")
          fi

          flyctl secrets set "${args[@]}" --app "$FLY_APP_NAME"

      - name: Deploy
        run: flyctl deploy --remote-only --app "$FLY_APP_NAME"
